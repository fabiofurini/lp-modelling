site_name: LP Modelling · Fabio Furini
site_url: https://fabiofurini.github.io/lp-modelling/
site_description: >-
  Linear programming models:
  lecture notes, Python/Gurobi code, data and case studies.
site_author: Fabio Furini
repo_url: https://github.com/fabiofurini/lp-modelling
copyright: >-
  &copy; 2026 Fabio Furini — text, figures and data licensed under
  <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a>,
  Python code licensed under
  <a href="https://github.com/fabiofurini/lp-modelling/blob/main/LICENSE-CODE">MIT</a>

theme:
  name: material
  language: en
  icon:
    logo: material/chart-line
  font:
    text: Source Sans 3
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.suggest

plugins:
  - search
  # 22/11/2026: the Tools part is now the Modelling part
  - redirects:
      redirect_maps:
        tools.md: modelling.md
extra:
  social:
    - icon: material/web
      link: https://fabiofurini.github.io/
      name: Fabio Furini — personal website
    - icon: material/school
      link: https://www.diag.uniroma1.it/
      name: DIAG — Sapienza University of Rome
    - icon: fontawesome/brands/github
      link: https://github.com/fabiofurini
      name: GitHub
    - icon: material/function-variant
      link: https://fabiofurini.github.io/mathematical-analysis-1/
      name: Mathematical Analysis 1
    - icon: material/matrix
      link: https://fabiofurini.github.io/linear-algebra/
      name: Linear Algebra
    - icon: material/code-braces
      link: https://fabiofurini.github.io/algorithms/
      name: Algorithms
    - icon: material/vector-triangle
      link: https://fabiofurini.github.io/linear-programming/
      name: Linear Programming
    - icon: material/dots-grid
      link: https://fabiofurini.github.io/integer-linear-programming/
      name: Integer Linear Programming
    - icon: material/vector-curve
      link: https://fabiofurini.github.io/convex-optimization/
      name: Convex Optimization
    - icon: material/graph-outline
      link: https://fabiofurini.github.io/network-optimization/
      name: Network Optimization
    - icon: material/hexagon-multiple-outline
      link: https://fabiofurini.github.io/combinatorial-optimization/
      name: Combinatorial Optimization Problems
    - icon: material/table-large
      link: https://fabiofurini.github.io/dynamic-programming/
      name: Dynamic Programming
    - icon: material/map-marker-path
      link: https://fabiofurini.github.io/heuristic-algorithms/
      name: Heuristic Algorithms
    - icon: material/approximately-equal
      link: https://fabiofurini.github.io/approximation-algorithms/
      name: Approximation Algorithms
    - icon: material/chart-bell-curve-cumulative
      link: https://fabiofurini.github.io/nlp-modelling/
      name: NLP Modelling
    - icon: material/vector-polygon
      link: https://fabiofurini.github.io/mip-modelling/
      name: MIP Modelling
  alternate:
    - name: English
      link: https://fabiofurini.github.io/lp-modelling/
      lang: en
    - name: Italiano
      link: https://fabiofurini.github.io/modellazione-pl/
      lang: it

extra_css:
  - stylesheets/collana.css
  - stylesheets/extra.css?v=e4b6ca6070
  # laboratorio interattivo (genera_laboratorio.py)
  - https://cdn.jsdelivr.net/npm/jsxgraph@1.10.1/distrib/jsxgraph.css
  - stylesheets/interattivi.css?v=c22e1a0e82
  - stylesheets/quiz.css?v=9e3792b41c

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - tables
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_javascript:
  - javascripts/collana.js?v=4f68d7e6a2
  - javascripts/cloudflare-analytics.js
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
  # laboratorio interattivo (genera_laboratorio.py): JSXGraph, il motore, gli helper comuni, i dati, poi le ricette
  - https://cdn.jsdelivr.net/npm/jsxgraph@1.10.1/distrib/jsxgraphcore.js
  - javascripts/interattivi.js?v=a6cfeda578
  - javascripts/gi-comune.js?v=74d7bb93a0
  - javascripts/gi-ott.js?v=04048d2032
  - javascripts/gi-pl-dati.js?v=3bb3aa7015
  - javascripts/gi-pl-modelli.js?v=574e57b3ed
  - javascripts/gi-pl-app.js?v=d036ba4840
  - javascripts/quiz.js?v=be7fae2b85

# the single app pages are not in the menu: the lab is one entry
not_in_nav: |
  /lab/*.md
  !/lab/index.md

nav:
  - Home: index.md
  - Modelling:
      - modelling.md
      - 1. Introduction to LP modelling: introduction.md
      - "2. Background: LP and sensitivity analysis": theory-lp.md
      - "3. The solver: building, solving, interpreting": solver-lp.md
      - 4. Modelling techniques:
          - Overview: techniques.md
          - 4.1 From the description to the model: techniques-01.md
          - 4.2 Production planning: techniques-02.md
          - 4.3 Blending: techniques-03.md
          - 4.4 Transportation: techniques-04.md
          - 4.5 Multi-period planning: techniques-05.md
          - 4.6 Min-max and max-min: techniques-06.md
          - 4.7 Absolute values: techniques-07.md
          - 4.8 Ratios and percentages: techniques-08.md
          - 4.9 What cannot be modelled: techniques-09.md
          - Worked models:
              - "Example 4.4 — Production with regular time and overtime": techniques-models-01.md
              - "Example 4.5 — Transportation from warehouses to clients": techniques-models-02.md
              - "Example 4.6 — Diet planning": techniques-models-03.md
              - "Example 4.7 — Diet planning for several classes": techniques-models-04.md
              - "Example 4.8 — Multi-period production with purchases and storage": techniques-models-05.md
              - "Example 4.9 — Choice of desserts": techniques-models-06.md
              - "Example 4.10 — Production and storage of fruit cakes": techniques-models-07.md
              - "Example 4.11 — Blending of crude oil in a refinery": techniques-models-08.md
              - "Example 4.12 — Production of three drugs": techniques-models-09.md
  - Deterministic models:
      - deterministic-models.md
      - Production and inventory: production.md
      - Electric vehicle charging: ev-charging.md
      - Data Envelopment Analysis: dea.md
  - Decisions under uncertainty:
      - decisions-uncertainty.md
      - The newsvendor: newsvendor.md
      - VaR and CVaR: var-cvar.md
      - Arbitrage and pricing: arbitrage.md
  - Optimization and machine learning:
      - optimization-ml.md
      - Robust and quantile regression: regression.md
  - Exercises: exercises/index.md
  - Quiz: self-assessment.md
  - Lab: lab/index.md
  - Downloads: downloads.md
  - Index:
      - Syllabus: syllabus.md
      - How to work with the course: organization.md
      - Notebooks in Colab: notebooks.md
